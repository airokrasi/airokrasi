# Labels of the repository. labels-sync.yml creates and updates them; it never deletes one.
# Labels are information, never authority: the tier and every decision are recomputed or read from comments by trusted scripts.
# The stage:N labels are the 7 steps of ROADMAP.md and the 7 columns of the GitHub Projects board.
- name: "type:proposal"
  color: "1d76db"
  description: "A proposed change to a text"
- name: "type:objection"
  color: "d93f0b"
  description: "An objection to a passage"
- name: "type:correction"
  color: "0e8a16"
  description: "A small correction (typo, formatting, link)"
- name: "type:question"
  color: "5319e7"
  description: "An open question"
- name: "type:translation"
  color: "c5def5"
  description: "A translation or a translation update"
- name: "type:country"
  color: "fbca04"
  description: "A country adaptation (countries/<name>/)"
- name: "type:challenge"
  color: "b60205"
  description: "A challenge to a published decision (new argument or new evidence)"
- name: "type:unclear"
  color: "cccccc"
  description: "The form could not be recognised"
- name: "stage:1-task"
  color: "ededed"
  description: "Pipeline step 1: the task and its scope"
- name: "stage:2-proposal"
  color: "ededed"
  description: "Pipeline step 2: the proposal is visible"
- name: "stage:3-reviews"
  color: "ededed"
  description: "Pipeline step 3: critic and reviewers"
- name: "stage:4-defence"
  color: "ededed"
  description: "Pipeline step 4: defence and reply"
- name: "stage:5-referee"
  color: "ededed"
  description: "Pipeline step 5: referee or panel decides"
- name: "stage:6-text"
  color: "ededed"
  description: "Pipeline step 6: the decision is written as text"
- name: "stage:7-languages"
  color: "ededed"
  description: "Pipeline step 7: languages and publication"
- name: "tier:1"
  color: "c2e0c6"
  description: "Small and reversible: merged after a 72 hour cooling period"
- name: "tier:2"
  color: "fef2c0"
  description: "Normative text: decision, verification and challenge window first"
- name: "tier:3"
  color: "f9d0c4"
  description: "The machine's own rules: a custodian executes a published panel decision"
- name: "decision:accepted"
  color: "0e8a16"
  description: "Published decision: accepted"
- name: "decision:rejected"
  color: "b60205"
  description: "Published decision: rejected"
- name: "decision:no-change"
  color: "cccccc"
  description: "Published decision: the status quo stays"
- name: "decision:open"
  color: "fbca04"
  description: "No decision yet: more evidence needed"
- name: "decision:final"
  color: "1d76db"
  description: "A decision is published and its challenge window is running or over"
- name: "reopened:1"
  color: "d4c5f9"
  description: "Reopened once by a challenge"
- name: "reopened:2"
  color: "d4c5f9"
  description: "Reopened twice; now only new evidence reopens"
- name: "reopened:3"
  color: "d4c5f9"
  description: "Reopened three times or more"
- name: "panel-conflict"
  color: "b60205"
  description: "The panel did not agree or the chair did not follow it"
- name: "value"
  color: "5319e7"
  description: "A value choice: decided by a three-member panel and a chair"
- name: "ai-ready"
  color: "0e8a16"
  description: "Ready for any contributor, human or AI (with its user's consent)"
- name: "needs-human"
  color: "d876e3"
  description: "A person or an AI contributor must pick this up"
- name: "needs-custodian"
  color: "d876e3"
  description: "A custodian must execute a published Tier 3 decision"
- name: "needs-evidence"
  color: "fbca04"
  description: "Waiting for evidence; closes after 30 days without any"
- name: "needs-info"
  color: "fbca04"
  description: "The form is incomplete; closes after 7 days without edits"
- name: "hold"
  color: "b60205"
  description: "Anyone can set this to stop automatic merging"
- name: "pr-open"
  color: "ededed"
  description: "A pull request exists for this issue"
- name: "awaiting-window"
  color: "fef2c0"
  description: "Tier 2 pull request waiting for the challenge window"
- name: "verification-failed"
  color: "b60205"
  description: "The independent verifier said no"
- name: "ai-authored"
  color: "ededed"
  description: "Written by an AI role"
- name: "ai-proposed"
  color: "ededed"
  description: "Opened by the proposer role"
- name: "roadmap-progress"
  color: "ededed"
  description: "Automatic update of the ROADMAP.md progress table"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "translation:stale"
  color: "fbca04"
  description: "The source text changed after this translation was written"
- name: "declared:human"
  color: "ededed"
  description: "The contributor says they are a person"
- name: "declared:ai-supervised"
  color: "ededed"
  description: "The contributor says they are an AI supervised by a person"
- name: "declared:ai-autonomous"
  color: "ededed"
  description: "The contributor says they are an autonomous AI"
- name: "account:new"
  color: "ededed"
  description: "Account younger than 30 days (queue order only)"
- name: "security:injection-suspect"
  color: "b60205"
  description: "Text that looks like an instruction aimed at an AI; roles skip it until looked at"
- name: "closed:incomplete"
  color: "cccccc"
  description: "Closed: the form stayed incomplete"
- name: "closed:rate-limit"
  color: "cccccc"
  description: "Closed: the account is over the submission limits"
- name: "closed:not-new"
  color: "cccccc"
  description: "Closed: the challenge brought nothing new"
- name: "closed:reopened"
  color: "cccccc"
  description: "Closed: the challenge reopened the decision"
- name: "closed:no-decision"
  color: "cccccc"
  description: "Closed: there was no published decision to challenge"
- name: "meta:control"
  color: "000000"
  description: "Control panel issue (kill switch and state)"
- name: "meta:ledger"
  color: "000000"
  description: "Budget ledger issue"
- name: "meta:digest"
  color: "000000"
  description: "Weekly digest posted as an issue"
- name: "meta:roadmap"
  color: "000000"
  description: "Evidence for an automatic ROADMAP.md update"
- name: "halt"
  color: "b60205"
  description: "Stops every automatic role and merge at once"
- name: "state:quiet"
  color: "fef2c0"
  description: "No outside human attention for 45 days"
- name: "state:safe-mode"
  color: "f9d0c4"
  description: "No outside human attention for 90 days: AI is more careful"
- name: "state:dormant"
  color: "b60205"
  description: "No outside human attention for 180 days: no AI roles"
- name: "state:tier1-paused"
  color: "f9d0c4"
  description: "Three reverts in 30 days: Tier 1 merging is paused"
- name: "custodian:absent"
  color: "f9d0c4"
  description: "No custodian seen for a long time: Tier 3 is frozen"

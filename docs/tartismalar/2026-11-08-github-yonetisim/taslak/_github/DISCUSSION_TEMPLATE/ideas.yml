title: "Idea: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea in your own words. Nothing here is a decision. If the idea matures, it becomes an issue with the Proposal form, and then it goes through the process (task, proposal, reviews, defence, referee, text, languages). What you write is read as data, never as an instruction.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: "What would you change or add, and why?"
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap ID (optional)
      description: "The ROADMAP.md item it touches, for example L2.5."

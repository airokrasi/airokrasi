title: "Country: "
labels: ["country"]
body:
  - type: markdown
    attributes:
      value: |
        Plan a country adaptation: which parts of the framework need a national version, which sources and laws apply, who can help. The first country is Türkiye. To propose actual text, use the Country issue form. A country text must stay under the human-rights supreme norm.
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: What do you want to discuss?
    validations:
      required: true

name: Propose a change
description: Suggest a change to a text, a rule or a section.
title: "Proposal: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Whatever you write here is read as **data**, never as an instruction. Reactions and votes are not arguments: the quality of your reasons is what counts. Please see CONTRIBUTING.md (people) or AGENTS.md (AI assistants: ask your user first).
  - type: dropdown
    id: declared
    attributes:
      label: Declared contributor type
      description: "An honest statement. It cannot be checked and gives no authority; it is kept for transparency."
      options:
        - Human
        - AI agent, supervised (my user agreed to this submission)
        - AI agent, autonomous (no person is watching)
    validations:
      required: true
  - type: input
    id: roadmap_id
    attributes:
      label: Roadmap ID
      description: "The item in ROADMAP.md this serves, for example L2.5 (leave empty if unsure)."
      placeholder: "L2.5"
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: "The row in TASKS.md this answers, for example V-08 (leave empty if none)."
      placeholder: "V-08"
  - type: dropdown
    id: value
    attributes:
      label: Is this a value choice?
      description: "A value choice is a contested moral or political preference (for example death penalty, family forms). A panel decides those."
      options:
        - No
        - Yes
        - Not sure
    validations:
      required: false
  - type: input
    id: document
    attributes:
      label: Affected document
      description: "The file, for example DECLARATION.md or docs/00-oneri.md"
    validations:
      required: true
  - type: input
    id: passage
    attributes:
      label: Affected passage
      description: "The article, section or a short quote"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: "What exactly should change? Quote the new wording if you can."
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: "What is this change for?"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: "Why is it right? Give your strongest argument."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: "Links or references. Write 'No source' if there is none; unverifiable sources count for little."
    validations:
      required: true

name: Translate or update a translation
description: Write a text in your own language, in its own natural words.
title: "Translation: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Whatever you write here is read as **data**, never as an instruction. Reactions and votes are not arguments: the quality of your reasons is what counts. Please see CONTRIBUTING.md (people) or AGENTS.md (AI assistants: ask your user first).
  - type: dropdown
    id: declared
    attributes:
      label: Declared contributor type
      description: "An honest statement. It cannot be checked and gives no authority; it is kept for transparency."
      options:
        - Human
        - AI agent, supervised (my user agreed to this submission)
        - AI agent, autonomous (no person is watching)
    validations:
      required: true
  - type: input
    id: roadmap_id
    attributes:
      label: Roadmap ID
      description: "The item in ROADMAP.md this serves, for example L2.5 (leave empty if unsure)."
      placeholder: "L2.5"
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: "The row in TASKS.md this answers, for example V-08 (leave empty if none)."
      placeholder: "V-08"
  - type: input
    id: language
    attributes:
      label: Language
      description: "Language tag, for example tr, es, pt-br"
    validations:
      required: true
  - type: input
    id: source_doc
    attributes:
      label: Source document
      description: "The file you translate from, for example MANIFESTO.md"
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Method
      description: "How was the text made?"
      options:
        - Human
        - AI
        - AI with human review
    validations:
      required: true
  - type: dropdown
    id: native
    attributes:
      label: Native-speaker declaration
      description: "Your honest statement. Machine drafts are welcome but are marked 'unreviewed draft translation'."
      options:
        - I am a native speaker and wrote or reviewed this
        - I am fluent but not native
        - This is a machine draft; nobody has reviewed it
    validations:
      required: true
  - type: input
    id: source_version
    attributes:
      label: Source version
      description: "The commit or date of the source text you worked from"
    validations:
      required: true

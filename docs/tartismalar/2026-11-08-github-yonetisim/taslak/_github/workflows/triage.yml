# Triage: deterministic intake. NO AI is used here.
#
# What it does for every new or edited issue:
#   1. finds the issue type from its form headings (also works for issues created through the API),
#   2. checks that the mandatory fields are present and not empty (K23 rationale fields) and that the optional
#      "Roadmap ID" (for example L2.5) and "Task ID" (for example V-08) have the right shape when they are given,
#   3. adds type / declared-contributor / expected-tier labels (labels are INFORMATION, never authority),
#   4. flags text that looks like an instruction aimed at an AI (security:injection-suspect). Flagged
#      issues are skipped by every Claude role until a human removes the flag,
#   5. enforces the submission limits (3 open per account, 5 new per day) for people without write access.
# A second job re-enables scheduled workflows that GitHub paused after 60 days of inactivity.
#
# Security notes
#   * Trigger is `issues`, never `pull_request_target`. No third-party actions: only `gh` and `jq` on the runner.
#   * Issue title, body and author name never appear inside `run:` text. They are read from the API into files
#     and handled as data (no `${{ }}` of user-controlled values in scripts).
#   * Permissions are empty at the top and minimal per job.

name: triage

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage the issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      ACTION: ${{ github.event.action }}
    steps:
      - name: Classify, validate, label
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh api "repos/$REPO/issues/$NUMBER" > "$tmp/issue.json"
          jq -r '.body // ""' "$tmp/issue.json" | tr -d '\r' > "$tmp/body.txt"
          author="$(jq -r '.user.login' "$tmp/issue.json")"
          author_type="$(jq -r '.user.type' "$tmp/issue.json")"
          assoc="$(jq -r '.author_association' "$tmp/issue.json")"
          labels=" $(jq -r '[.labels[].name] | join(" ")' "$tmp/issue.json") "

          # Skip issues created by automation itself (ledger, control panel, digests, AI-proposed drafts).
          if [[ "$labels" == *" meta:"* || "$author_type" == "Bot" ]]; then exit 0; fi

          has_heading() { grep -qxF "### $1" "$tmp/body.txt"; }
          heading_filled() {
            awk -v h="### $1" '
              $0 == h { f = 1; next }
              /^### /  { f = 0 }
              f && NF && $0 != "_No response_" { ok = 1 }
              END { exit ok ? 0 : 1 }' "$tmp/body.txt"
          }

          # 1) Type from the distinctive heading (order matters).
          type=""
          if   has_heading "Decision issue";              then type="challenge"
          elif has_heading "Native-speaker declaration";  then type="translation"
          elif has_heading "Contribution kind";           then type="country"
          elif has_heading "Corrected text";              then type="correction"
          elif has_heading "Objection";                   then type="objection"
          elif has_heading "Question";                    then type="question"
          elif has_heading "Proposed change";             then type="proposal"
          fi

          declare -A REQUIRED=(
            [proposal]="Declared contributor type|Affected document|Affected passage|Proposed change|Purpose|Reason|Sources"
            [objection]="Declared contributor type|Affected document|Affected passage|Objection|Purpose|Reason|Sources"
            [correction]="Declared contributor type|Affected document|Affected passage|Corrected text|Reason|Sources"
            [question]="Declared contributor type|Question|Why it matters"
            [translation]="Declared contributor type|Language|Source document|Method|Native-speaker declaration|Source version"
            [country]="Declared contributor type|Country|Contribution kind|Working language|English summary|Proposed change|Purpose|Reason|Sources"
            [challenge]="Declared contributor type|Decision issue|Challenge kind|New argument or evidence"
          )

          add=(); missing=()
          [[ "$labels" == *" stage:"* ]] || add+=("stage:1-task")
          if [[ -z "$type" ]]; then
            add+=("type:unclear" "needs-info")
          else
            [[ "$labels" == *" type:$type "* ]] || add+=("type:$type")
            IFS='|' read -ra need <<< "${REQUIRED[$type]}"
            for h in "${need[@]}"; do heading_filled "$h" || missing+=("$h"); done
            (( ${#missing[@]} == 0 )) || add+=("needs-info")
          fi

          # 1b) Roadmap ID and Task ID: optional, but if present they must have the right shape (data, never authority).
          field_first() { awk -v h="### $1" '$0 == h {f=1; next} /^### / {f=0} f && NF {print; exit}' "$tmp/body.txt" | tr -d '\r' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g'; }
          rid="$(field_first "Roadmap ID")"; tid="$(field_first "Task ID")"
          if [[ -n "$rid" && "$rid" != "_No response_" && ! "$rid" =~ ^L[0-8](\.[0-9]{1,2})?$ ]]; then add+=("needs-info"); missing+=("Roadmap ID"); fi
          if [[ -n "$tid" && "$tid" != "_No response_" && ! "$tid" =~ ^[VRDWS]-[0-9]{2}$ ]]; then add+=("needs-info"); missing+=("Task ID"); fi

          # 2) Declared contributor type (an unverifiable statement, kept for transparency only).
          declared="$(awk '/^### Declared contributor type$/ {f=1; next} /^### / {f=0} f && NF {print; exit}' "$tmp/body.txt")"
          case "$declared" in
            Human*)                       add+=("declared:human") ;;
            *supervised*|*Supervised*)    add+=("declared:ai-supervised") ;;
            *autonomous*|*Autonomous*)    add+=("declared:ai-autonomous") ;;
          esac

          # 3) Expected tier (advisory; the real tier is computed from the diff when a PR exists).
          doc="$(awk '/^### Affected document$/ {f=1; next} /^### / {f=0} f && NF {print; exit}' "$tmp/body.txt" | tr 'A-Z' 'a-z')"
          tier="2"
          case "$type" in correction|question|translation) tier="1" ;; esac
          if [[ "$doc" =~ (\.github|agents\.md|claude\.md|gemini\.md|governance|security\.md|contributing|code_of_conduct|llms\.txt|workflow|permission|budget|ruleset|codeowners) ]]; then tier="3"; fi
          [[ "$type" == "challenge" ]] && tier="2"
          [[ "$labels" == *" tier:"* ]] || add+=("tier:$tier")
          # K31: Tier 3 is decided by a panel and executed by a custodian. No founder or board approval exists.
          # A value question (Task ID V-xx, a declaration/manifesto/constitution text, or "Yes" in the value field) gets the panel.
          vflag="$(field_first "Is this a value choice?")"
          if [[ "$tid" =~ ^V- || "$doc" =~ (declaration|manifesto|constitution) || "$vflag" == Yes* ]]; then
            [[ "$labels" == *" value "* ]] || add+=("value")
          fi

          # 4) Instruction-like text aimed at AIs: flag and keep Claude away from it until a human looks.
          if grep -qiE "ignore (all |any |the )?(previous|prior|above|earlier) (instructions|rules|prompts?)|disregard (all |any |the )?(previous|prior|above|your) (instructions|rules)|you are now (a|an|the)\b|new (system )?instructions?:|system prompt|<\|im_start\|>|(reveal|print|show|send|post|exfiltrate).{0,40}(secret|api.?key|token|password|environ)|<!--" "$tmp/body.txt" \
             || grep -qP "[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{2064}\x{2066}-\x{2069}\x{FEFF}]" "$tmp/body.txt" 2>/dev/null; then
            add+=("security:injection-suspect")
          fi

          # 5) Account age (information used only for queue order, never for authority).
          created="$(gh api "users/$author" --jq '.created_at' 2>/dev/null || echo "")"
          if [[ -n "$created" ]]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
            (( age >= 30 )) || add+=("account:new")
          fi

          # 6) Submission limits for people without write access.
          limited=0
          if [[ "$ACTION" == "opened" && "$assoc" != "OWNER" && "$assoc" != "MEMBER" && "$assoc" != "COLLABORATOR" ]]; then
            open_n="$(gh api -X GET search/issues -f q="repo:$REPO is:issue is:open author:$author -label:meta:digest" --jq '.total_count' 2>/dev/null || echo 0)"
            since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
            day_n="$(gh api -X GET search/issues -f q="repo:$REPO is:issue author:$author created:>=$since" --jq '.total_count' 2>/dev/null || echo 0)"
            if (( open_n > 3 || day_n > 5 )); then limited=1; fi
          fi

          if (( limited )); then
            gh issue edit "$NUMBER" --repo "$REPO" --add-label "closed:rate-limit"
            printf 'Thank you for contributing. This account is above the submission limits in AGENTS.md (3 open submissions, 5 new per day). Please wait for earlier ones to be handled, then open this again. This message is automatic.\n' \
              | gh issue comment "$NUMBER" --repo "$REPO" --body-file -
            gh issue close "$NUMBER" --repo "$REPO" --reason "not planned"
            exit 0
          fi

          if (( ${#add[@]} > 0 )); then
            args=(); for l in "${add[@]}"; do args+=(--add-label "$l"); done
            gh issue edit "$NUMBER" --repo "$REPO" "${args[@]}"
          fi

          # 7) Remove needs-info once an edit completes the form; otherwise ask once with a fixed text.
          if [[ "$ACTION" == "edited" && -n "$type" && ${#missing[@]} -eq 0 && "$labels" == *" needs-info "* ]]; then
            rm_args=(--remove-label "needs-info")
            [[ "$labels" == *" type:unclear "* ]] && rm_args+=(--remove-label "type:unclear")
            gh issue edit "$NUMBER" --repo "$REPO" "${rm_args[@]}"
            [[ "$labels" == *" type:$type "* ]] || gh issue edit "$NUMBER" --repo "$REPO" --add-label "type:$type"
          fi
          if [[ "$ACTION" == "opened" ]] && { [[ -z "$type" ]] || (( ${#missing[@]} > 0 )); }; then
            {
              echo "Thank you. This submission cannot enter the process yet."
              echo
              if [[ -z "$type" ]]; then
                echo "- The type was not recognised. Please use one of the issue forms, or write the body with the headings listed in AGENTS.md."
              else
                echo "Missing, empty or wrongly shaped fields (headings are case-sensitive; Roadmap ID looks like L2.5, Task ID like V-08):"
                for h in "${missing[@]}"; do echo "- \`### $h\`"; done
              fi
              echo
              echo "Edit the issue to complete it. After 7 days without changes it is closed as incomplete."
              echo
              echo "_Automatic message. Text inside submissions is treated as data, never as instructions._"
            } | gh issue comment "$NUMBER" --repo "$REPO" --body-file -
          fi

  keepalive:
    name: Re-enable workflows paused for inactivity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # GitHub pauses scheduled workflows in public repositories after 60 days without repository activity.
      # An outside issue is activity that still reaches this job, so a quiet project can wake itself up.
      # UNVERIFIED: the state value "disabled_inactivity" and whether GITHUB_TOKEN may enable the workflow.
      # Test it once (KURULUM.md, acceptance tests).
      - shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows" --jq '.workflows[] | select(.state == "disabled_inactivity") | .id' \
            | while read -r id; do
                [[ "$id" =~ ^[0-9]+$ ]] && gh api -X PUT "repos/$REPO/actions/workflows/$id/enable" || true
              done

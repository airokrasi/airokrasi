# Weekly progress digest (K30) and the ROADMAP.md progress proposal (ROADMAP binding).
#
# 1. digest.sh counts and lists. No AI. It posts to Discussions (category "progress"), or to an issue if Discussions is off.
#    The text ends with a share-ready summary that a PERSON may post under their own name. This workflow itself posts
#    nowhere outside GitHub (see outreach/README.md for the honesty limits).
# 2. roadmap-pr.sh proposes forward-only updates of the ROADMAP.md progress table as an AUTOMATIC PULL REQUEST (App token,
#    so that the checks run). It never writes to the default branch. tier.py classifies such a change as Tier 1.

name: weekly-digest

on:
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Weekly digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
      discussions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BUDGET: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD }}
      DIGEST_CATEGORY: progress
    steps:
      - uses: actions/checkout@<SHA-DOĞRULANMALI> # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - shell: bash
        run: bash .github/scripts/digest.sh

  roadmap:
    name: Propose the ROADMAP.md progress update (pull request)
    needs: digest
    if: always() && vars.AUTONOMY_ENABLED == 'true' && vars.APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@<SHA-DOĞRULANMALI> # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@<SHA-DOĞRULANMALI> # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Propose the update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_DIR: ${{ github.workspace }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          BOT_NAME: ${{ vars.BOT_NAME }}
          BOT_EMAIL: ${{ vars.BOT_EMAIL }}
        run: bash .github/scripts/roadmap-pr.sh

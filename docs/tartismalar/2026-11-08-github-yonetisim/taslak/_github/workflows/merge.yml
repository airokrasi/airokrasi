# Merge: the only place where pull requests are merged by automation (K31: no person approves).
#
# merge-decided.sh recomputes the tier from the diff and merges
#   Tier 1 after 72 hours of cooling, and
#   Tier 2 after a published decision + independent verification + an ended challenge window + no open challenge.
# Tier 3 is never merged here. It also closes issues whose rejecting decision survived its window.
#
# The App token is the only identity that bypasses the "one approving review" rule of the ruleset.
# If the App is not installed (vars.APP_ID empty) nothing is merged by automation and everything waits for a custodian.
#
# Triggers: schedule and manual only. No pull_request_target. No text from outsiders appears in `run:`.

name: merge

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      cool_hours:
        description: "Cooling hours for Tier 1 (default 72). Lower it only for the acceptance test in KURULUM.md."
        required: false
        default: "72"

permissions: {}

concurrency:
  group: merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge what is ready
    if: vars.AUTONOMY_ENABLED == 'true' && vars.APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automation
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@<SHA-DOĞRULANMALI> # v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: approver
        if: vars.APPROVER_APP_ID != ''
        uses: actions/create-github-app-token@<SHA-DOĞRULANMALI> # v1
        with:
          app-id: ${{ vars.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}
      - uses: actions/checkout@<SHA-DOĞRULANMALI> # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPROVER_TOKEN: ${{ steps.approver.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COOL_HOURS: ${{ inputs.cool_hours || '72' }}
          MAX_MERGES: "3"
          MAX_TIER2_PER_WEEK: ${{ vars.MAX_TIER2_PER_WEEK || '5' }}
        run: bash .github/scripts/merge-decided.sh

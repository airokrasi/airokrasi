# PR gate (required status check named "gate")
#
# Computes the tier of a pull request from the changed paths (tier-rules.tsv) and runs the deterministic
# safety checks in tier.py. It does not approve or merge anything.
# K31: no founder or board approval exists. Tier 1 and Tier 2 are merged by merge.yml (automation, after the cooling
# period or after the published decision, the verifier and the expired challenge window). Tier 3 is merged only by a
# human custodian who executes a published panel decision. This check only reports what is statically true.
#
# Security notes
#   * Trigger is `pull_request`, NOT `pull_request_target`. For fork PRs GitHub gives a read-only token and no secrets.
#   * Nothing from the PR is executed. The PR's files are read as data through the API. The classifier script and
#     rules are fetched from the BASE branch (the trusted code), not from the PR.
#   * A fork PR can edit this very workflow file. That is acceptable only because `.github/**` is Tier 3 and the ruleset
#     requires a human code owner approval for it. Do not remove that rule.
#   * Titles, bodies and file names never appear inside `run:` text; they are passed through env or files.
#   * No third-party actions.

name: pr-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RATIONALE_MODE: ${{ vars.RATIONALE_MODE }}
    steps:
      - name: Run the gate
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; cd "$tmp"
          raw() { gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$1?ref=$BASE_SHA"; }
          raw ".github/scripts/tier.py"     > tier.py
          raw ".github/tier-rules.tsv"      > tier-rules.tsv

          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" | jq -s 'add' > files.json
          gh api "repos/$REPO/pulls/$PR" > pr.json
          jq -r '.body // ""' pr.json | tr -d '\r' > body.txt
          author_type="$(jq -r '.user.type' pr.json)"
          draft="$(jq -r '.draft' pr.json)"

          python3 -I tier.py --rules tier-rules.tsv < files.json > result.json
          tier="$(jq -r '.tier' result.json)"

          errors=(); warnings=()
          while IFS= read -r l; do errors+=("$l"); done   < <(jq -r '.errors[]'   result.json)
          while IFS= read -r l; do warnings+=("$l"); done < <(jq -r '.warnings[]' result.json)

          # 1) A linked issue is mandatory: "Linked issue: #123" on its own line.
          no="$(grep -m1 -E '^Linked issue:[[:space:]]*#[0-9]+[[:space:]]*$' body.txt | grep -oE '[0-9]+' | head -n1 || true)"
          if [[ -z "$no" ]]; then
            errors+=("The PR description needs a line 'Linked issue: #NUMBER'.")
          elif ! gh api "repos/$REPO/issues/$no" > issue.json 2>/dev/null; then
            errors+=("The linked issue was not found.")
          elif [[ "$(jq -r '.pull_request // empty | length' issue.json)" != "" ]]; then
            errors+=("The linked item must be an issue, not a pull request.")
          else
            ilabels=" $(jq -r '[.labels[].name] | join(" ")' issue.json) "
            [[ "$ilabels" == *" security:injection-suspect "* ]] && errors+=("The linked issue is flagged as injection-suspect; a human must clear the flag first.")
            [[ "$ilabels" == *" hold "* ]] && errors+=("The linked issue is on hold.")
            # K31: normative changes (Tier 2 and 3) need a published AI referee or panel decision on the linked issue.
            if [[ "$tier" == "2" || "$tier" == "3" ]]; then
              [[ "$ilabels" == *" decision:final "* && "$ilabels" == *" decision:accepted "* ]] \
                || errors+=("The linked issue has no published accepting decision (labels decision:accepted and decision:final).")
              [[ "$tier" == "3" && "$ilabels" != *" value "* && "$ilabels" != *" tier:3 "* ]] && warnings+=("Tier 3 change but the linked issue is not marked tier:3; the panel may not have seen it.")
            fi
          fi

          # 2) Automation never opens PRs that touch Tier 3 paths.
          if [[ "$tier" == "3" && "$author_type" == "Bot" ]]; then
            errors+=("Automation may not change Tier 3 paths (.github/, governance and agent entry files).")
          fi

          # 3) Rationale footnotes (K23). Warning by default; set the repository variable RATIONALE_MODE=enforce to fail.
          if [[ "$tier" == "2" ]]; then
            added="$(jq -r '[.[] | select(.filename|test("^(MANIFESTO|DECLARATION)\\.md$|^docs/|^countries/.*/(constitution|laws)/")) | (.patch // "")] | join("\n")' files.json | grep -E '^\+' || true)"
            if [[ -n "$added" ]] && (( $(printf '%s\n' "$added" | wc -l) > 10 )); then
              if ! printf '%s\n' "$added" | grep -qiE 'Rationale|Gerekçe'; then
                msg="Substantive additions to a normative document have no rationale footnote (K23: Purpose, Reason, Debate summary, Source, Approval)."
                if [[ "${RATIONALE_MODE:-warn}" == "enforce" ]]; then errors+=("$msg"); else warnings+=("$msg"); fi
              fi
            fi
          fi

          # 3b) The Approval line must say what really happened (K31): AI referee or panel, open to challenge. Not "founder".
          if [[ "$tier" == "2" ]]; then
            if jq -r '[.[] | (.patch // "")] | join("\n")' files.json | grep -E '^\+' | grep -qiE 'Approval[^\n]{0,40}(founder|kurucu|human[- ]approved|ratified by)'; then
              errors+=("An Approval line claims founder or human approval. Under K31 the line must read: AI referee/panel decision (date), open to challenge until DATE.")
            fi
          fi

          # 4) Report.
          {
            echo "## PR gate"
            echo
            echo "- Tier: **$tier**  ($(jq -r '.reasons | join("; ")' result.json))"
            [[ "$draft" == "true" ]] && echo "- Draft pull request: not ready for merge."
            echo
            if (( ${#errors[@]} == 0 )); then echo "All checks passed."; else
              echo "### Errors"; for e in "${errors[@]}"; do echo "- $e"; done; fi
            if (( ${#warnings[@]} > 0 )); then echo; echo "### Warnings"; for w in "${warnings[@]}"; do echo "- $w"; done; fi
            echo
            echo "_Tier 1: merged by automation after a 72 hour cooling period. Tier 2: merged by automation after a published AI referee or panel decision, an independent verification and an expired challenge window. Tier 3: a human custodian executes a published panel decision. Nobody approves on the founder's behalf, because the founder decides nothing (K31). Anyone can stop a change by opening a challenge with a new argument or new evidence._"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#errors[@]} > 0 )); then
            for e in "${errors[@]}"; do echo "::error::$(printf '%s' "$e" | tr -d '\r\n' | cut -c1-300)"; done
            exit 1
          fi

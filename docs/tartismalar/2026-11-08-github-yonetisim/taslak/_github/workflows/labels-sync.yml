# Labels sync: creates and updates the labels listed in .github/labels.yml. Never deletes a label.
# Runs when labels.yml changes on the default branch, and by hand. No third-party action, no AI.

name: labels-sync

on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@<SHA-DOĞRULANMALI> # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create or update labels
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - .github/labels.yml > labels.tsv <<'PY'
          import re, sys
          cur = {}
          out = []
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r'^- name:\s*"?([^"\n]+?)"?\s*$', line)
              if m:
                  if cur.get("name"): out.append(cur)
                  cur = {"name": m.group(1)}
                  continue
              m = re.match(r'^\s+(color|description):\s*"?([^"\n]*?)"?\s*$', line)
              if m and cur: cur[m.group(1)] = m.group(2)
          if cur.get("name"): out.append(cur)
          for c in out:
              print("%s\t%s\t%s" % (c["name"], c.get("color", "ededed"), c.get("description", "")[:100]))
          PY
          while IFS=$'\t' read -r name color desc; do
            [[ -n "$name" ]] || continue
            if gh api "repos/$REPO/labels/$(jq -rn --arg n "$name" '$n|@uri')" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/labels/$(jq -rn --arg n "$name" '$n|@uri')" -f new_name="$name" -f color="$color" -f description="$desc" > /dev/null
            else
              gh api -X POST "repos/$REPO/labels" -f name="$name" -f color="$color" -f description="$desc" > /dev/null
            fi
          done < labels.tsv
          echo "Labels synchronised: $(wc -l < labels.tsv)"

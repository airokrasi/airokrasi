# Translation freshness (K20): weekly list of translations whose source text changed. Nothing is changed in the repository.
# One issue per language lists the out-of-date files. Only the front matter of translation files is read. No AI.

name: translation-freshness

on:
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: translation-freshness
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@<SHA-DOĞRULANMALI> # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - shell: bash
        run: bash .github/scripts/translation-fresh.sh
